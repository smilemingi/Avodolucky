<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Avodo 오늘의 운세</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-900 via-purple-900 to-slate-900 min-h-screen text-white flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white/10 backdrop-blur-xl border border-white/20 rounded-3xl p-6 sm:p-8 shadow-2xl text-center relative overflow-hidden">
        
        <!-- 상단 언어 선택 및 빛 효과 -->
        <div class="absolute -top-24 -left-24 w-48 h-48 bg-purple-500/30 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-24 -right-24 w-48 h-48 bg-indigo-500/30 rounded-full blur-3xl pointer-events-none"></div>

        <div class="flex justify-between items-center mb-6">
            <span class="text-xs font-bold text-purple-300 tracking-wider">AVODO FORTUNE</span>
            <!-- 언어 셀렉터 -->
            <select id="lang-select" onchange="changeLanguage(this.value)" class="bg-black/40 border border-white/20 text-xs rounded-xl px-3 py-1.5 text-white outline-none focus:border-amber-400 transition cursor-pointer">
                <option value="ko" class="bg-slate-900">🇰🇷 한국어</option>
                <option value="en" class="bg-slate-900">🇺🇸 English</option>
                <option value="ja" class="bg-slate-900">🇯🇵 日本語</option>
                <option value="zh" class="bg-slate-900">🇨🇳 中文</option>
            </select>
        </div>

        <!-- 헤더 -->
        <h1 id="txt-main-title" class="text-2xl sm:text-3xl font-extrabold tracking-tight mb-2 bg-gradient-to-r from-amber-300 to-yellow-500 bg-clip-text text-transparent">
            ✨ 오늘의 운세 ✨
        </h1>
        <p id="txt-sub-title" class="text-gray-300 text-xs sm:text-sm mb-6 sm:mb-8">하루에 딱 한 번, 당신의 운을 시험해보세요!</p>

        <!-- 메인 인터랙션 영역 -->
        <div id="content-box" class="space-y-6">
            <!-- 운세 뽑기 전 화면 -->
            <div id="before-draw">
                <div class="w-28 h-28 sm:w-32 sm:h-32 mx-auto bg-gradient-to-tr from-amber-400 to-yellow-300 rounded-3xl flex items-center justify-center shadow-lg shadow-yellow-500/20 transform hover:scale-105 active:scale-95 transition duration-300 cursor-pointer" onclick="drawFortune()">
                    <span class="text-4xl sm:text-5xl">🥠</span>
                </div>
                <button onclick="drawFortune()" id="txt-btn-draw" class="mt-6 w-full py-3.5 sm:py-4 bg-gradient-to-r from-amber-400 to-yellow-500 text-gray-900 font-bold rounded-2xl shadow-lg hover:brightness-110 active:scale-95 transition text-base sm:text-lg cursor-pointer">
                    운세 쿠키 깨기 🍪
                </button>
            </div>

            <!-- 운세 결과 화면 (숨김 처리) -->
            <div id="after-draw" class="hidden space-y-4 text-left bg-black/30 p-5 sm:p-6 rounded-2xl border border-white/10">
                <div class="flex justify-between items-center border-b border-white/10 pb-3">
                    <span id="res-title" class="text-amber-400 font-bold text-base sm:text-lg"></span>
                    <span id="res-score" class="text-xs sm:text-sm bg-amber-400/20 text-amber-300 px-3 py-1 rounded-full font-semibold"></span>
                </div>
                <p id="res-desc" class="text-gray-200 text-xs sm:text-sm leading-relaxed"></p>
                <div class="bg-white/5 p-3 rounded-xl text-xs text-gray-400 flex justify-between items-center">
                    <span id="txt-lucky-item-label">💡 오늘의 행운 아이템</span>
                    <span id="res-item" class="text-white font-semibold"></span>
                </div>
            </div>

            <!-- 이미 뽑았을 때 안내 문구 (숨김 처리) -->
            <div id="already-drawn" class="hidden space-y-4">
                <div id="txt-already-msg" class="p-5 sm:p-6 bg-red-500/10 border border-red-500/30 rounded-2xl text-red-200 text-xs sm:text-sm leading-relaxed">
                    ⏳ 오늘은 이미 운세를 확인하셨습니다!<br>내일 다시 찾아와 주세요.
                </div>
            </div>
        </div>

        <!-- 하단 푸터 -->
        <div class="mt-6 sm:mt-8 text-xs text-gray-500">
            © Avodo Company. All rights reserved.
        </div>
    </div>

    <script>
        // 다국어 텍스트 패키지
        const i18n = {
            ko: {
                mainTitle: "✨ 오늘의 운세 ✨",
                subTitle: "하루에 딱 한 번, 당신의 운을 시험해보세요!",
                btnDraw: "운세 쿠키 깨기 🍪",
                luckyItemLabel: "💡 오늘의 행운 아이템",
                alreadyMsg: "⏳ 오늘은 이미 운세를 확인하셨습니다!<br>내일 다시 찾아와 주세요.",
                alertOnce: "하루에 한 번만 볼 수 있습니다!",
                fortunes: [
                    { title: "대길 (大吉) 🌟", score: "행운 지수 100%", desc: "오늘은 뭘 해도 잘 풀리는 날입니다! 머릿속으로만 생각했던 일이 있다면 지금 바로 도전해 보세요. 뜻밖의 귀인이 나타날 수 있습니다.", item: "따뜻한 아메리카노" },
                    { title: "소길 (小吉) ✨", score: "행운 지수 80%", desc: "소소하고 기분 좋은 일들이 가득한 하루예요. 길을 가다가 우연히 좋아하는 노래가 흘러나오거나, 가벼운 행운이 찾아옵니다.", item: "초콜릿 쿠키" },
                    { title: "평온 (平穩) ☕", score: "행운 지수 60%", desc: "잔잔하고 평화로운 하루입니다. 무리한 도전보다는 평소 하던 일에 집중하면서 내실을 다지기에 가장 좋은 시간이에요.", item: "시원한 물 한 잔" },
                    { title: "조심 (小心) ⚠️", score: "행운 지수 40%", desc: "사소한 실수가 생길 수 있으니 완벽을 기하는 것이 좋습니다. 중요한 물건을 두고 다니지 않도록 가방 속을 한번 더 확인해 보세요!", item: "보라색 아이템" },
                    { title: "대박 반전 🚀", score: "행운 지수 95%", desc: "처음엔 조금 꼬이는 것처럼 보이지만, 결국 대반전으로 기분 좋게 마무리되는 하루입니다. 걱정하지 말고 미소를 유지하세요!", item: "이어폰" }
                ]
            },
            en: {
                mainTitle: "✨ Daily Fortune ✨",
                subTitle: "Test your luck just once a day!",
                btnDraw: "Break Fortune Cookie 🍪",
                luckyItemLabel: "💡 Lucky Item",
                alreadyMsg: "⏳ You have already checked your fortune today!<br>Please come back tomorrow.",
                alertOnce: "You can only check your fortune once a day!",
                fortunes: [
                    { title: "Great Luck (大吉) 🌟", score: "Luck 100%", desc: "Everything goes smoothly today! If you have something in mind, take action now. An unexpected helper might appear.", item: "Warm Americano" },
                    { title: "Small Luck (小吉) ✨", score: "Luck 80%", desc: "A day full of small, pleasant moments. You might hear your favorite song on the street or get a pleasant surprise.", item: "Chocolate Cookie" },
                    { title: "Peaceful (平穩) ☕", score: "Luck 60%", desc: "A calm and peaceful day. Rather than taking reckless challenges, focus on your routine and build your inner strength.", item: "Glass of Cold Water" },
                    { title: "Caution (小心) ⚠️", score: "Luck 40%", desc: "Minor mistakes can happen, so strive for perfection. Double-check your bag so you don't leave important items behind!", item: "Purple Item" },
                    { title: "Plot Twist 🚀", score: "Luck 95%", desc: "It might look a bit tricky at first, but it will end with an awesome twist! Keep smiling and don't worry.", item: "Earphones" }
                ]
            },
            ja: {
                mainTitle: "✨ 今日の運勢 ✨",
                subTitle: "1日1回だけ、あなたの運を試してみましょう！",
                btnDraw: "フォーチュンクッキーを割る 🍪",
                luckyItemLabel: "💡 ラッキーアイテム",
                alreadyMsg: "⏳ 本日の運勢はすでに確認済みです！<br>また明日お越しください。",
                alertOnce: "1日に1回しか見ることができません！",
                fortunes: [
                    { title: "大吉 (大吉) 🌟", score: "幸運指数 100%", desc: "何をしてもうまくいく一日です！心の中で考えていたことがあれば今すぐ挑戦してみてください。思わぬ協力者が現れるかも。", item: "温かいアメリカーノ" },
                    { title: "小吉 (小吉) ✨", score: "幸運指数 80%", desc: "ささやかで嬉しい出来事が詰まった一日です。道端で偶然好きな曲が流れてきたり、小さな幸運が訪れます。", item: "チョコレートクッキー" },
                    { title: "平穏 (平穏) ☕", score: "幸運指数 60%", desc: "穏やかで平和な一日です。無理な挑戦よりは、普段やっていることに集中して内実を固めるのに一番良い時間です。", item: "冷たいお水一杯" },
                    { title: "注意 (小心) ⚠️", score: "幸運指数 40%", desc: "些細なミスが起こるかもしれないので慎重になりましょう。大切なものを忘れないようバッグの中をもう一度確認して！", item: "紫色のアイテム" },
                    { title: "大逆転 🚀", score: "幸運指数 95%", desc: "最初は少しこじれるように見えても、結局は大逆転で気分よく終わる一日です。心配しないで笑顔を維持して！", item: "イヤホン" }
                ]
            },
            zh: {
                mainTitle: "✨ 今日运势 ✨",
                subTitle: "一天仅一次，来测测你的好运吧！",
                btnDraw: "砸开幸运饼干 🍪",
                luckyItemLabel: "💡 幸运物品",
                alreadyMsg: "⏳ 您今天已经看过了运势！<br>请明天再来。",
                alertOnce: "一天只能查看一次！",
                fortunes: [
                    { title: "大吉 (大吉) 🌟", score: "幸运指数 100%", desc: "今天做什么都会很顺利！如果有一直想做的事，现在就去挑战吧，可能会遇到意想不到的贵人。", item: "温美式咖啡" },
                    { title: "小吉 (小吉) ✨", score: "幸运指数 80%", desc: "充满温馨和美好小确幸的一天。在路上偶然听到喜欢的歌，或者收获一份小惊喜。", item: "巧克力曲奇" },
                    { title: "平稳 (平穩) ☕", score: "幸运指数 60%", desc: "平静祥和的一天。比起冒险挑战，专注于日常事务、充实自我会是最好的选择。", item: "一杯冰水" },
                    { title: "小心 (小心) ⚠️", score: "幸运指数 40%", desc: "可能会出现小失误，行事尽量追求完美。再检查一下包包，别把重要物品落下啦！", item: "紫色单品" },
                    { title: "大反转 🚀", score: "幸运指数 95%", desc: "虽然一开始可能会遇到点小波折，但最终会迎来超爽的大反转！别担心，保持微笑吧！", item: "耳机" }
                ]
            }
        };

        let currentLang = 'ko';

        function getTodayDate() {
            const date = new Date();
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        // 언어 변경 함수
        function changeLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('avodo_fortune_lang', lang);
            updateUIStrings();

            // 이미 뽑았는지 여부에 따라 텍스트 업데이트
            const lastDrawnDate = localStorage.getItem('avodo_fortune_date');
            const today = getTodayDate();
            if (lastDrawnDate === today) {
                const savedIndex = localStorage.getItem('avodo_fortune_index');
                if (savedIndex !== null) {
                    showResultContent(i18n[currentLang].fortunes[savedIndex]);
                }
            }
        }

        // UI 텍스트 일괄 업데이트
        function updateUIStrings() {
            const t = i18n[currentLang];
            document.getElementById('txt-main-title').innerText = t.mainTitle;
            document.getElementById('txt-sub-title').innerText = t.subTitle;
            document.getElementById('txt-btn-draw').innerText = t.btnDraw;
            document.getElementById('txt-lucky-item-label').innerText = t.luckyItemLabel;
            document.getElementById('txt-already-msg').innerHTML = t.alreadyMsg;
        }

        window.onload = function() {
            // 저장된 언어 불러오기 (기본값 한국어)
            const savedLang = localStorage.getItem('avodo_fortune_lang') || 'ko';
            currentLang = savedLang;
            document.getElementById('lang-select').value = savedLang;
            updateUIStrings();

            const lastDrawnDate = localStorage.getItem('avodo_fortune_date');
            const today = getTodayDate();

            if (lastDrawnDate === today) {
                document.getElementById('before-draw').classList.add('hidden');
                document.getElementById('already-drawn').classList.remove('hidden');
                
                const savedIndex = localStorage.getItem('avodo_fortune_index');
                if (savedIndex !== null) {
                    showResultContent(i18n[currentLang].fortunes[savedIndex]);
                    document.getElementById('after-draw').classList.remove('hidden');
                }
            }
        };

        function drawFortune() {
            const today = getTodayDate();
            const lastDrawnDate = localStorage.getItem('avodo_fortune_date');

            if (lastDrawnDate === today) {
                alert(i18n[currentLang].alertOnce);
                return;
            }

            const fortunes = i18n[currentLang].fortunes;
            const randomIndex = Math.floor(Math.random() * fortunes.length);
            const selectedFortune = fortunes[randomIndex];

            localStorage.setItem('avodo_fortune_date', today);
            localStorage.setItem('avodo_fortune_index', randomIndex);
            localStorage.setItem('avodo_fortune_lang', currentLang);

            document.getElementById('before-draw').classList.add('hidden');
            showResultContent(selectedFortune);
            document.getElementById('after-draw').classList.remove('hidden');
        }

        function showResultContent(fortune) {
            document.getElementById('res-title').innerText = fortune.title;
            document.getElementById('res-score').innerText = fortune.score;
            document.getElementById('res-desc').innerText = fortune.desc;
            document.getElementById('res-item').innerText = fortune.item;
        }
    </script>
</body>
</html>
