    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }

        /* 쿠키 흔들림 애니메이션 */
        @keyframes cookieShake {
            0% { transform: rotate(0deg) scale(1); }
            20% { transform: rotate(-12deg) scale(1.1); }
            40% { transform: rotate(12deg) scale(1.1); }
            60% { transform: rotate(-12deg) scale(1.15); }
            80% { transform: rotate(12deg) scale(1.15); }
            100% { transform: rotate(0deg) scale(1.3); opacity: 0; filter: blur(4px); }
        }

        .cookie-shake {
            animation: cookieShake 0.6s ease-in-out forwards;
        }

        /* 결과지 등장 애니메이션 */
        @keyframes paperUnfold {
            0% { opacity: 0; transform: scale(0.5) translateY(30px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .animate-paper { animation: paperUnfold 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>

        let currentLang = 'ko';

        function getTodayDate() {
            const date = new Date();
            return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
        }

        function changeLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('avodo_fortune_lang', lang);
            updateUIStrings();

            const lastDrawnDate = localStorage.getItem('avodo_fortune_date');
            if (lastDrawnDate === getTodayDate()) {
                const savedIndex = localStorage.getItem('avodo_fortune_index');
                if (savedIndex !== null) {
                    showResultContent(i18n[currentLang].fortunes[savedIndex]);
                }
            }
        }

        function updateUIStrings() {
            const t = i18n[currentLang];
            document.getElementById('txt-main-title').innerText = t.mainTitle;
            document.getElementById('txt-sub-title').innerText = t.subTitle;
            document.getElementById('txt-btn-draw').innerText = t.btnDraw;
            document.getElementById('label-dos').innerText = t.labelDos;
            document.getElementById('label-donts').innerText = t.labelDonts;
            document.getElementById('label-item').innerText = t.labelItem;
            document.getElementById('txt-already-msg').innerHTML = t.alreadyMsg;
        }

        window.onload = function() {
            const savedLang = localStorage.getItem('avodo_fortune_lang') || 'ko';
            currentLang = savedLang;
            document.getElementById('lang-select').value = savedLang;
            updateUIStrings();

            if (localStorage.getItem('avodo_fortune_date') === getTodayDate()) {
                document.getElementById('before-draw').classList.add('hidden');
                document.getElementById('already-drawn').classList.remove('hidden');
                
                const savedIndex = localStorage.getItem('avodo_fortune_index');
                if (savedIndex !== null) {
                    showResultContent(i18n[currentLang].fortunes[savedIndex]);
                    document.getElementById('after-draw').classList.remove('hidden');
                }
            }
        };

        function drawFortune() {
            const today = getTodayDate();
            if (localStorage.getItem('avodo_fortune_date') === today) {
                alert(i18n[currentLang].alertOnce);
                return;
            }

            // 쿠키 흔들리며 깨지는 애니메이션 실행
            const cookie = document.getElementById('cookie-btn');
            cookie.classList.add('cookie-shake');

            const fortunes = i18n[currentLang].fortunes;
            const randomIndex = Math.floor(Math.random() * fortunes.length);
            const selectedFortune = fortunes[randomIndex];

            localStorage.setItem('avodo_fortune_date', today);
            localStorage.setItem('avodo_fortune_index', randomIndex);
            localStorage.setItem('avodo_fortune_lang', currentLang);

            // 0.6초 애니메이션 끝난 후 결과창 등장
            setTimeout(() => {
                document.getElementById('before-draw').classList.add('hidden');
                showResultContent(selectedFortune);
                
                const afterBox = document.getElementById('after-draw');
                afterBox.classList.remove('hidden');
                afterBox.classList.add('animate-paper');
            }, 600);
        }

        function showResultContent(fortune) {
            document.getElementById('res-title').innerText = fortune.title;
            document.getElementById('res-score').innerText = fortune.score;
            document.getElementById('res-desc').innerText = fortune.desc;
            document.getElementById('res-dos').innerText = fortune.dos;
            document.getElementById('res-donts').innerText = fortune.donts;
            document.getElementById('res-item').innerText = fortune.item;
        }
    </script>
