<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Avodo 오늘의 운세</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-900 via-purple-900 to-slate-900 min-h-screen text-white flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white/10 backdrop-blur-xl border border-white/20 rounded-3xl p-6 sm:p-8 shadow-2xl text-center relative overflow-hidden">
        
        <!-- 상단 언어 선택 및 빛 효과 -->
        <div class="absolute -top-24 -left-24 w-48 h-48 bg-purple-500/30 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-24 -right-24 w-48 h-48 bg-indigo-500/30 rounded-full blur-3xl pointer-events-none"></div>

        <div class="flex justify-between items-center mb-6">
            <span class="text-xs font-bold text-purple-300 tracking-wider">AVODO FORTUNE</span>
            <!-- 언어 셀렉터 -->
            <select id="lang-select" onchange="changeLanguage(this.value)" class="bg-black/40 border border-white/20 text-xs rounded-xl px-3 py-1.5 text-white outline-none focus:border-amber-400 transition cursor-pointer">
                <option value="ko" class="bg-slate-900">🇰🇷 한국어</option>
                <option value="en" class="bg-slate-900">🇺🇸 English</option>
                <option value="ja" class="bg-slate-900">🇯🇵 日本語</option>
                <option value="zh" class="bg-slate-900">🇨🇳 中文</option>
            </select>
        </div>

        <!-- 헤더 -->
        <h1 id="txt-main-title" class="text-2xl sm:text-3xl font-extrabold tracking-tight mb-2 bg-gradient-to-r from-amber-300 to-yellow-500 bg-clip-text text-transparent">
            ✨ 오늘의 운세 ✨
        </h1>
        <p id="txt-sub-title" class="text-gray-300 text-xs sm:text-sm mb-6 sm:mb-8">하루에 딱 한 번, 당신의 운을 시험해보세요!</p>

        <!-- 메인 인터랙션 영역 -->
        <div id="content-box" class="space-y-6">
            <!-- 운세 뽑기 전 화면 -->
            <div id="before-draw">
                <div class="w-28 h-28 sm:w-32 sm:h-32 mx-auto bg-gradient-to-tr from-amber-400 to-yellow-300 rounded-3xl flex items-center justify-center shadow-lg shadow-yellow-500/20 transform hover:scale-105 active:scale-95 transition duration-300 cursor-pointer" onclick="drawFortune()">
                    <span class="text-4xl sm:text-5xl">🥠</span>
                </div>
                <button onclick="drawFortune()" id="txt-btn-draw" class="mt-6 w-full py-3.5 sm:py-4 bg-gradient-to-r from-amber-400 to-yellow-500 text-gray-900 font-bold rounded-2xl shadow-lg hover:brightness-110 active:scale-95 transition text-base sm:text-lg cursor-pointer">
                    운세 쿠키 깨기 🍪
                </button>
            </div>

            <!-- 운세 결과 화면 (숨김 처리) -->
            <div id="after-draw" class="hidden space-y-4 text-left bg-black/30 p-5 sm:p-6 rounded-2xl border border-white/10">
                <div class="flex justify-between items-center border-b border-white/10 pb-3">
                    <span id="res-title" class="text-amber-400 font-bold text-base sm:text-lg"></span>
                    <span id="res-score" class="text-xs sm:text-sm bg-amber-400/20 text-amber-300 px-3 py-1 rounded-full font-semibold"></span>
                </div>
                <p id="res-desc" class="text-gray-200 text-xs sm:text-sm leading-relaxed"></p>
                <div class="bg-white/5 p-3 rounded-xl text-xs text-gray-400 flex justify-between items-center">
                    <span id="txt-lucky-item-label">💡 오늘의 행운 아이템</span>
                    <span id="res-item" class="text-white font-semibold"></span>
                </div>
            </div>

            <!-- 이미 뽑았을 때 안내 문구 (숨김 처리) -->
            <div id="already-drawn" class="hidden space-y-4">
                <div id="txt-already-msg" class="p-5 sm:p-6 bg-red-500/10 border border-red-500/30 rounded-2xl text-red-200 text-xs sm:text-sm leading-relaxed">
                    ⏳ 오늘은 이미 운세를 확인하셨습니다!<br>내일 다시 찾아와 주세요.
                </div>
            </div>
        </div>

        <!-- 하단 푸터 -->
        <div class="mt-6 sm:mt-8 text-xs text-gray-500">
            © Avodo Company. All rights reserved.
        </div>
    </div>
